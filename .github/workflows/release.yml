name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'release tag (defaults to v<package.json version>)'
        required: false

permissions:
  contents: write

jobs:
  web:
    name: build web bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/KaiLARP-core
          path: core-src
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: install ffmpeg for the recording probes
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npx playwright install --with-deps chromium
      - run: node scripts/sync-core.mjs --core core-src
      - run: npx expo export --platform web --output-dir dist
        env:
          CI: 1
      - name: verify the web build and record it
        run: node scripts/verify-web.mjs
      - name: package the web build
        run: |
          version=$(node -p "require('./package.json').version")
          mkdir -p release-assets
          (cd dist && zip -qr "../release-assets/kailarp-sandbox-web-${version}.zip" .)
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: |
            release-assets/
            dist/
            out/sandbox-verification.json
            out/sandbox-verification.md
            out/sandbox-summary.png
            out/screen/

  android:
    name: build android apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/KaiLARP-core
          path: core-src
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: node scripts/sync-core.mjs --core core-src
      - name: build the apk
        run: |
          npx expo prebuild --platform android --no-install
          cd android
          ./gradlew assembleRelease --no-daemon
        env:
          EXPO_PUBLIC_AUTORUN: demo
      - name: name the artifact after the version
        run: |
          version=$(node -p "require('./package.json').version")
          mkdir -p release-assets
          cp android/app/build/outputs/apk/release/app-release.apk \
             "release-assets/kailarp-sandbox-android-${version}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: release-assets/

  # Runs on a real emulator so the release carries a screen recording of the
  # app actually working, not just a binary.
  device:
    name: record the apk on an emulator
    runs-on: ubuntu-latest
    needs: android
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: android
          path: release-assets
      - name: boot a phone, run the app, record the screen
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_2
          emulator-boot-timeout: 900
          disable-animations: false
          emulator-options: >-
            -no-window -no-snapshot -noaudio -no-boot-anim
            -gpu swiftshader_indirect -camera-back none -camera-front none
          script: |
            version=$(node -p "require('./package.json').version")
            adb wait-for-device
            adb install -r "release-assets/kailarp-sandbox-android-${version}.apk"
            adb shell am start -n dev.kailarp.sandbox/.MainActivity
            sleep 25
            adb shell screenrecord --time-limit 30 --size 480x960 /sdcard/kailarp-device.mp4 &
            sleep 35
            mkdir -p out
            adb pull /sdcard/kailarp-device.mp4 out/kailarp-device.mp4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-recording
          path: out/

  publish:
    name: publish the github release
    runs-on: ubuntu-latest
    needs: [web, android, device]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: assemble release assets
        run: |
          version=$(node -p "require('./package.json').version")
          tag="${{ github.event.inputs.tag }}"
          [ -n "$tag" ] || tag="$GITHUB_REF_NAME"
          [ -n "$tag" ] || tag="v$version"
          echo "TAG=$tag" >> "$GITHUB_ENV"
          mkdir -p release
          cp artifacts/android/* release/ 2>/dev/null || true
          cp artifacts/web/release-assets/* release/ 2>/dev/null || true
          cp artifacts/device/kailarp-device.mp4 release/kailarp-sandbox-device-${version}.mp4 2>/dev/null || true
          cp artifacts/web/out/sandbox-verification.json release/kailarp-sandbox-web-verification.json 2>/dev/null || true
          cp artifacts/web/out/sandbox-verification.md release/kailarp-sandbox-web-verification.md 2>/dev/null || true
          cp artifacts/web/out/sandbox-summary.png release/kailarp-sandbox-summary.png 2>/dev/null || true
          mkdir -p release/screen && cp artifacts/web/out/screen/* release/screen/ 2>/dev/null || true
          ls -la release release/screen
      - name: create or update the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "KaiLARP Sandbox $TAG" --generate-notes
          gh release upload "$TAG" $(find release -maxdepth 1 -type f) $(find release/screen -type f) --clobber
